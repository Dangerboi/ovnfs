name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  release:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # Lets the upload mint the GitHub OIDC token (audience build.stencil.so)
      # the build service authenticates this repository's tag runs with.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # No Go cache: the published binaries build from nothing another run
      # could have saved.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      # goreleaser is built from the Go module proxy rather than downloaded from
      # GitHub releases, whose 504s once held a release back; keep the version
      # in step with ci.yml (dependabot does not see it).
      - name: goreleaser
        run: go run github.com/goreleaser/goreleaser/v2@v2.20.0 release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # The installers, `ovnfs update` and `ovnfs send` download release
      # binaries from build.stencil.so, not from the GitHub release.
      - name: publish to build.stencil.so
        run: go run ./internal/release/upload "$GITHUB_REF_NAME"
